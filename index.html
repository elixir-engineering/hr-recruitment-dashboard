<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HR Recruitment Dashboard</title>
<style>
:root{
 --bg:#eef2f7; --pnl:#fff; --pnl2:#f6f9fc; --hd:#fff; --line:#dfe6ef;
 --tx:#101b2d; --tx2:#54637a; --tx3:#8fa0b5;
 --a1:#3b7fe8; --a2:#12a37a; --a3:#e08700; --a4:#e0384a; --a5:#8b5cf6; --a6:#0ea5c4; --a7:#db2777; --a8:#65a30d;
 --sh:0 1px 3px rgba(16,27,45,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:13px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
 display:flex;flex-direction:column;overflow:hidden}

/* ---------- header ---------- */
.hdr{background:var(--hd);border-bottom:1px solid var(--line);padding:0 16px;height:48px;
 display:flex;align-items:center;gap:14px;flex-shrink:0}
.hdr h1{font-size:14.5px;font-weight:670;letter-spacing:-.2px;white-space:nowrap}
.hdr .meta{font-size:11px;color:var(--tx3);white-space:nowrap}
.spacer{flex:1}
.st{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:4px 10px;
 border-radius:20px;border:1px solid var(--line);color:var(--tx2);white-space:nowrap}
.st i{width:7px;height:7px;border-radius:50%;background:var(--tx3);flex-shrink:0}
.st.live i{background:var(--a2);box-shadow:0 0 0 3px rgba(46,204,155,.18)}
.st.snap i{background:var(--a3)}
.st.load i{background:var(--a1);animation:pl 1s infinite}
.st.err i{background:var(--a4)}
@keyframes pl{50%{opacity:.25}}
.ib{background:var(--pnl);border:1px solid var(--line);color:var(--tx2);height:29px;padding:0 11px;
 border-radius:6px;cursor:pointer;font:600 11.5px/1 inherit;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.ib:hover{color:var(--tx);border-color:var(--a1)}

/* ---------- filter bar ---------- */
.fbar{background:var(--hd);border-bottom:1px solid var(--line);padding:7px 16px;display:flex;gap:7px;
 align-items:center;flex-wrap:wrap;flex-shrink:0}
.dd{position:relative}
.dd>button{background:var(--pnl);border:1px solid var(--line);color:var(--tx2);height:29px;padding:0 9px 0 10px;
 border-radius:6px;cursor:pointer;font:500 11.5px/1 inherit;display:flex;align-items:center;gap:7px;min-width:118px;white-space:nowrap}
.dd>button:hover{border-color:var(--a1);color:var(--tx)}
.dd>button b{color:var(--tx3);font-weight:650;font-size:10px;text-transform:uppercase;letter-spacing:.5px}
.dd>button s{text-decoration:none;color:var(--tx);flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;max-width:118px}
.dd>button:after{content:'▾';color:var(--tx3);font-size:9px}
.dd.act>button{border-color:var(--a1);background:rgba(76,141,255,.1);color:var(--a1)}
.dd.act>button s{color:var(--a1)}
.pop{position:absolute;top:33px;left:0;z-index:60;background:var(--pnl);border:1px solid var(--line);
 border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.4);min-width:225px;max-width:300px;padding:7px;display:none}
.pop.open{display:block}
.pop input.s{width:100%;background:var(--pnl2);border:1px solid var(--line);color:var(--tx);border-radius:5px;
 padding:5px 8px;font:12px inherit;margin-bottom:6px}
.pop .acts{display:flex;gap:5px;margin-bottom:6px}
.pop .acts button{flex:1;background:var(--pnl2);border:1px solid var(--line);color:var(--tx2);border-radius:5px;
 padding:4px;font:600 10.5px inherit;cursor:pointer}
.pop .acts button:hover{color:var(--a1);border-color:var(--a1)}
.pop .list{max-height:238px;overflow:auto}
.pop label{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:5px;cursor:pointer;font-size:12px;color:var(--tx2)}
.pop label:hover{background:var(--pnl2);color:var(--tx)}
.pop label input{accent-color:var(--a1);cursor:pointer;flex-shrink:0}
.pop label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.pop label em{font-style:normal;color:var(--tx3);font-size:10.5px}
.fsearch{background:var(--pnl);border:1px solid var(--line);color:var(--tx);height:29px;border-radius:6px;
 padding:0 10px;font:12px inherit;width:170px}
.fsearch:focus{outline:none;border-color:var(--a1)}

/* ---------- kpi strip ---------- */
.kstrip{display:grid;grid-template-columns:repeat(9,1fr);gap:7px;padding:9px 16px 0;flex-shrink:0}
.kc{background:var(--pnl);border:1px solid var(--line);border-radius:7px;padding:7px 10px;box-shadow:var(--sh);
 border-left:2.5px solid var(--c,var(--a1));min-width:0}
.kc .l{font-size:9px;text-transform:uppercase;letter-spacing:.6px;color:var(--tx3);font-weight:700;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc .v{font-size:19px;font-weight:700;letter-spacing:-.6px;color:var(--c,var(--tx));line-height:1.25}
.kc .n{font-size:9.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;padding:9px 16px 0;flex-shrink:0}
.tabs button{background:transparent;border:1px solid transparent;border-bottom:none;color:var(--tx2);
 padding:7px 15px;cursor:pointer;font:600 12px inherit;border-radius:7px 7px 0 0}
.tabs button:hover{color:var(--tx);background:var(--pnl2)}
.tabs button.on{color:var(--a1);background:var(--pnl);border-color:var(--line);position:relative;top:1px}

/* ---------- grid ---------- */
.page{flex:1;overflow:auto;padding:0 16px 14px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;padding-top:9px}
.g4>.w2{grid-column:span 2}
.g4>.w4{grid-column:1/-1}          /* full-width row, e.g. the stacked record tables */
@media(max-width:1500px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.kstrip{grid-template-columns:repeat(4,1fr)}}
@media(max-width:820px){.g4{grid-template-columns:1fr}.g4>.w2,.g4>.w4{grid-column:span 1}.kstrip{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--pnl);border:1px solid var(--line);border-radius:8px;box-shadow:var(--sh);
 display:flex;flex-direction:column;height:var(--th,322px);min-width:0}
.tile.t2{height:calc(var(--th,322px)*2 + 9px)}
body.dense{--th:246px}
body.dense .kc .v{font-size:17px}
body.dense .kstrip{padding-top:7px}
.tile>.th{padding:8px 11px 6px;border-bottom:1px solid var(--line);flex-shrink:0}
.tile>.th .a{font-size:11.5px;font-weight:670;color:var(--tx);line-height:1.3;display:flex;align-items:center;gap:5px}
.tile>.th .b{font-size:9.5px;color:var(--tx3);line-height:1.35;margin-top:1px}
.inf{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border-radius:50%;
 border:1px solid var(--tx3);color:var(--tx3);font-size:9px;font-weight:700;cursor:help;flex-shrink:0}
.inf:hover{border-color:var(--a1);color:var(--a1)}

/* ---------- key findings strip ---------- */
.kf{padding:9px 16px 0;flex-shrink:0}
.kf .kfin{background:var(--pnl);border:1px solid var(--line);border-radius:8px;box-shadow:var(--sh);
 padding:7px 10px;display:flex;align-items:center;gap:9px}
.kf .kfh{font-size:9px;text-transform:uppercase;letter-spacing:.6px;color:var(--tx3);font-weight:700;
 white-space:nowrap;border-right:1px solid var(--line);padding-right:10px;flex-shrink:0;cursor:pointer}
.kf .kfs{display:flex;gap:8px;overflow-x:auto;flex:1;scrollbar-width:thin}
.kf .kfs::-webkit-scrollbar{height:5px}
.kf .kfs::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.kf .kfc{border-left:2.5px solid var(--c,var(--a1));background:var(--pnl2);border-radius:0 5px 5px 0;
 padding:5px 9px;min-width:265px;max-width:340px;flex-shrink:0}
.kf .kfc .t{font-weight:670;font-size:10.5px;color:var(--c,var(--tx));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kf .kfc .d{font-size:10.5px;color:var(--tx2);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;
 -webkit-box-orient:vertical;overflow:hidden}
body.kfoff .kf .kfs{display:none}
.tile>.bd{flex:1;overflow:auto;padding:8px 10px;min-height:0}
.tile>.bd::-webkit-scrollbar,.pop .list::-webkit-scrollbar,.page::-webkit-scrollbar{width:7px;height:7px}
.tile>.bd::-webkit-scrollbar-thumb,.pop .list::-webkit-scrollbar-thumb,.page::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{position:sticky;top:0;background:var(--pnl);text-align:left;color:var(--tx3);font-size:9px;text-transform:uppercase;
 letter-spacing:.5px;padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;z-index:2}
th:hover{color:var(--a1)}
td{padding:4px 6px;border-bottom:1px solid var(--line);color:var(--tx2);white-space:nowrap}
td.w,th.w{white-space:normal;min-width:260px;max-width:480px;line-height:1.4}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover td{background:var(--pnl2);color:var(--tx)}
.g{color:var(--a2);font-weight:650}.r{color:var(--a4);font-weight:650}.o{color:var(--a3);font-weight:650}
.pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:9.5px;font-weight:650}
.lgd{display:flex;gap:11px;flex-wrap:wrap;font-size:10px;color:var(--tx2);margin-top:5px}
.lgd i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.ins{border-left:2.5px solid var(--c,var(--a1));background:var(--pnl2);border-radius:0 5px 5px 0;padding:6px 9px;margin-bottom:6px}
.ins .t{font-weight:670;font-size:11px;color:var(--c,var(--tx));margin-bottom:1px}
.ins .d{font-size:11px;color:var(--tx2);line-height:1.45}
.empty{color:var(--tx3);font-size:11.5px;padding:26px 8px;text-align:center}
svg text{font-family:inherit}
.bl{font-size:10px;fill:var(--tx2)}.bv{font-size:10px;fill:var(--tx);font-weight:650}
.gl{stroke:var(--line);stroke-dasharray:2 3;stroke-width:1}
.hide{display:none!important}
/* ---------- drill-through panel ---------- */
[data-d]{cursor:pointer}
[data-d]:hover{opacity:1!important;filter:brightness(1.18)}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:none}
#scrim.on{display:block}
#drill{position:fixed;top:0;right:0;bottom:0;width:min(920px,94vw);background:var(--pnl);z-index:81;
 border-left:1px solid var(--line);box-shadow:-8px 0 40px rgba(0,0,0,.5);display:none;flex-direction:column}
#drill.on{display:flex}
#drill .dh{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px;flex-shrink:0}
#drill .dh h2{font-size:14.5px;font-weight:670;letter-spacing:-.2px}
#drill .dh .s{font-size:11.5px;color:var(--tx3);margin-top:2px}
#drill .dh .x{background:none;border:1px solid var(--line);color:var(--tx2);width:28px;height:28px;
 border-radius:6px;cursor:pointer;font-size:16px;line-height:1;flex-shrink:0}
#drill .dh .x:hover{color:var(--a4);border-color:var(--a4)}
#drill .dk{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:7px;padding:10px 18px 0;flex-shrink:0}
#drill .dk div{background:var(--pnl2);border:1px solid var(--line);border-radius:6px;padding:6px 9px}
#drill .dk .l{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--tx3);font-weight:700}
#drill .dk .v{font-size:16px;font-weight:700;color:var(--tx);letter-spacing:-.4px}
#drill .db{flex:1;overflow:auto;padding:10px 18px 18px;min-height:0}
#drill .df{padding:10px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}
#toast{position:fixed;bottom:16px;right:16px;background:var(--pnl);border:1px solid var(--line);
 border-left:3px solid var(--a1);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--tx2);
 box-shadow:0 8px 28px rgba(0,0,0,.4);z-index:99;max-width:380px;display:none}
</style></head><body>

</aside>
<div id="toast"></div>

/* ---------------- cleaning rules (mirror of the Python ETL) ---------------- */
function pdate(v){
  if(v==null)return null;
  if(v instanceof Date)return isNaN(v)?null:v;
  let s=nrm(v); if(!s||s==='-'||s==='--'||/^n\/?a$/i.test(s))return null;
  let m=s.match(/^Date\((\d+),(\d+),(\d+)/);              // gviz native date
  if(m)return new Date(+m[1],+m[2],+m[3]);
  s=s.replace(/[.\-]/g,'/');
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);          // dd/mm/yyyy
  if(!m)return null;
  let d=+m[1],mo=+m[2],y=+m[3]; if(y<100)y+=2000;
  if(mo>12&&d<=12){const t=d;d=mo;mo=t;}
  if(mo<1||mo>12||d<1||d>31||y<2020||y>2030)return null;
  const dt=new Date(y,mo-1,d); return isNaN(dt)?null:dt;
}
const iso=d=>d?d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'):null;

function psal(v){
  let s=nrm(v).toLowerCase();
  if(!s||s==='-'||s==='--'||s==='na')return null;
  if(/norm|negotiab|as par|as per/.test(s))return null;
  let m=s.match(/\(([\d.]+)\s*k\)/); if(m)return Math.round(+m[1]*1000);        // 5.8(41K)
  m=s.match(/([\d.]+)\s*(lpa|lac|lakh)/); if(m)return Math.round(+m[1]*100000/12);
  const ks=[...s.matchAll(/(\d+(?:\.\d+)?)\s*k/g)].map(x=>+x[1]);
  if(ks.length){let v2=ks.reduce((a,b)=>a+b,0)/ks.length*1000;
    if(v2>500000)v2/=1000; return Math.round(v2);}                              // 21700k typo
  const p=s.match(/\d+(?:\.\d+)?/);
  if(p){let v2=+p[0];
    if(v2<=60)v2=v2*100000/12; else if(v2<1000)v2*=1000; else if(v2>500000)v2/=12;
    return Math.round(v2);}
  return null;
}
/* Interviewer names are kept exactly as the sheet records them.
   Only casing and unmistakable spelling slips are corrected — one person is never
   folded into another. "Ali Sir" and "Ali Hussain" are DIFFERENT people: the sheet
   contains the single entry "Ali sir/ ALI hUSSAIN / Syed Sir", naming both at once. */
const NAMEFIX={
  'muzamli naik':'Muzammil Naik','muammil naik':'Muzammil Naik','muzammil naik':'Muzammil Naik',
  'muzammil':'Muzammil Naik',
  'ali hussian':'Ali Hussain','ali hussain':'Ali Hussain',
  'aliasagar sir':'Aliasgar Sir','aliasagar':'Aliasgar','aliasgar khumbhat':'Aliasgar',
  'pavin sir':'Pravin Sir','khaild sir':'Khaled Sir','khaleed sir':'Khaled Sir',
  'zubai sir':'Zubair Sir','sandip patel':'Sandip','sandip sir':'Sandip',
  'sachin sir':'Sachin Pawar','sachin pawar':'Sachin Pawar',
  'omkar khedekar':'Omkar','shahnawaz sir':'Shahnawaz Sir'};
const titleCase=s=>s.replace(/\S+/g,w=>w[0].toUpperCase()+w.slice(1).toLowerCase());
function onePerson(v){
  const s=nrm(v); if(!s)return '';
  const k=s.toLowerCase();
  return NAMEFIX[k]||titleCase(s);
}
/* a panel of several interviewers keeps every name, normalised and in a stable order */
function person(v){
  const s=nrm(v); if(!s)return '(blank)';
  if(/[/,]/.test(s)){
    const parts=[...new Set(s.split(/\s*[/,]\s*/).map(onePerson).filter(Boolean))].sort();
    return parts.length?parts.join(' / '):'(blank)';   // sorted so A/B and B/A are one panel
  }
  return onePerson(s)||'(blank)';
}
const DEPTP={VF:'Fire / Vaccifire',POR:'Project',P0R:'Project',TFM:'TFM',ADM:'Admin',
 IOT:'IOT',ACC:'Accounts',PUR:'Purchase'};
function splitPos(v){const s=nrm(v); if(!s)return ['(blank)','','(blank)'];
 const m=s.match(/([A-Za-z0]{2,4})\s*\/\s*(\d{2,3})\s*$/);
 if(!m)return [s,'','Other'];
 const pre=m[1].toUpperCase();
 return [nrm(s.slice(0,m.index))||s, pre+'/'+m[2], DEPTP[pre]||'Other'];}

const JOINED=['Joined','Joined & Left'];
const SELST=['Selected','Selected - Offer Extended'].concat(JOINED);
const ACTST=['Shortlisted','Interview Scheduled','In Progress','Hold','Selected','Selected - Offer Extended'];
const LOSTST=['Rejected','Candidate Not Interested'];

/* ---------------- status as an ordered timeline ----------------
   Status is not a category — it is where the candidate currently sits in the process,
   updated as they move. Confirmed order:
     CV received -> Interview Scheduled -> Shortlisted (interviewed, awaiting a decision)
     -> Selected -> Offer Extended -> Joined -> (Joined & Left)
   Hold / In Progress are paused; Rejected / Not Interested are exits. */
const FLOW=['(blank)','Interview Scheduled','Shortlisted','Selected','Selected - Offer Extended',
            'Joined','Joined & Left','In Progress','Hold','Rejected','Candidate Not Interested'];
const FLOWLAB={'(blank)':'CV received','Shortlisted':'Shortlisted (interviewed)'};
const stRank=s=>{const i=FLOW.indexOf(s);return i<0?FLOW.length:i;};
const stLabel=s=>FLOWLAB[s]||s;
/* stages where the candidate is still live and someone owes them a decision */
const WAITING=['(blank)','Interview Scheduled','Shortlisted','Selected','Selected - Offer Extended','In Progress','Hold'];

/* ---------------- build model from raw rows ---------------- */
function buildCands(rows){
  const out=[];
  rows.forEach(r=>{
    const name=nrm(r[1]); if(!name||/^candidate name$/i.test(name))return;
    const [pos,code,dept]=splitPos(r[4]);
    const cvd=pdate(r[3])||pdate(r[0]), ivd=pdate(r[11]), seld=pdate(r[14]), jd=pdate(r[15]);
    const status=nrm(r[10])||'(blank)';
    const cs=psal(r[12]), es=psal(r[13]);
    const o={name,pos,code,dept,
      src:nrm(r[5])||'(blank)', mode:nrm(r[6])||'(blank)',
      rec:nrm(r[8])?nrm(r[8]).replace(/\b\w/g,c=>c.toUpperCase()):'(blank)',
      panel:person(r[7]),
      loc:nrm(r[9])?nrm(r[9]).replace(/\b\w+/g,w=>w[0].toUpperCase()+w.slice(1).toLowerCase()):'(blank)',
      status, cvd:iso(cvd), ivd:iso(ivd), seld:iso(seld), jd:iso(jd),
      ym:cvd?iso(cvd).slice(0,7):null, cs, es, remark:nrm(r[17])};
    o.stage = JOINED.includes(status)?4 : (SELST.includes(status)||seld)?3
            : (status==='Interview Scheduled'||ivd)?2 : 1;
    o.interviewed=o.stage>=2?1:0; o.selected=o.stage>=3?1:0;
    o.joined=JOINED.includes(status)?1:0;
    o.retained=status==='Joined'?1:0; o.left=status==='Joined & Left'?1:0;
    o.active=ACTST.includes(status)?1:0; o.lost=LOSTST.includes(status)?1:0;
    const cl=(a,b)=>{const d=days(a,b);return (d!=null&&d>=-5&&d<=400)?d:null;};
    o.d_cv_iv=cl(o.cvd,o.ivd); o.d_iv_sel=cl(o.ivd,o.seld);
    o.d_sel_join=cl(o.seld,o.jd); o.d_total=cl(o.cvd,o.jd);
    o.hike=(cs&&es&&cs>3000)?Math.round((es-cs)/cs*1000)/10:null;
    out.push(o);
  });
  return out;
}
function buildReqs(rows){
  const T=new Date(); const out=[];
  rows.forEach(r=>{
    const des=nrm(r[1]); if(!des||/^designation$/i.test(des))return;
    const [pos,code,dc]=splitPos(des);
    const gi=v=>{const s=nrm(v);return /^\d+(\.\d+)?$/.test(s)?Math.round(+s):0;};
    const start=pdate(r[4]), end=pdate(r[5]);
    const status=(nrm(r[3])||'(blank)').toUpperCase();
    out.push({pos,code,dept:nrm(r[6])||dc,loc:nrm(r[2])||'(blank)',status,
      nos:gi(r[7]),onboard:gi(r[8]),bal:gi(r[9]),
      owner:nrm(r[10])||'(unassigned)',
      start:iso(start),end:iso(end),
      age:start?Math.round((T-start)/864e5):null,
      overdue:!!(end&&end<T&&status==='OPEN'),
      remark:nrm(r[11])});
  });
  return out;
}

/* ---------------- JSONP live loader ---------------- */
let cbN=0;
function gviz(tab,cols){
  return new Promise((res,rej)=>{
    const cb='__gv'+(++cbN)+'_'+Date.now();
    const url='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq'
      +'?tqx=out:json;responseHandler:'+cb
      +'&sheet='+encodeURIComponent(tab)
      +'&tq='+encodeURIComponent('select '+cols)
      +'&_='+Date.now();
    const s=document.createElement('script'); let done=false;
    const to=setTimeout(()=>{if(!done){done=true;cleanup();rej(new Error('timeout'));}},20000);
    function cleanup(){clearTimeout(to);try{delete window[cb]}catch(e){window[cb]=undefined};s.remove();}
    window[cb]=(o)=>{done=true;cleanup();
      if(!o||o.status==='error'){rej(new Error((o&&o.errors&&o.errors[0]&&o.errors[0].detailed_message)||'sheet error'));return;}
      // normalise to array-of-arrays using formatted values where available
      const rows=(o.table.rows||[]).map(rw=>(rw.c||[]).map(c=>c==null?'':(c.f!=null?c.f:(c.v==null?'':c.v))));
      res(rows);};
    s.onerror=()=>{if(!done){done=true;cleanup();rej(new Error('network / sheet not public'));}};
    s.src=url; document.head.appendChild(s);
  });
}

async function loadLive(manual){
  setStat('load','Loading live…');
  // requisition tab is optional — the dashboard still works on the tracker alone
  const [trR,rqR]=await Promise.allSettled([
    gviz(TAB_TRACKER,'A,B,C,D,E,F,G,H,I,J,K,L,M,N,O,P,Q,R'),
    gviz(TAB_REQS,   'A,B,C,D,E,F,G,H,I,J,K,L')
  ]);
  if(trR.status==='fulfilled'){
    try{
      const c=buildCands(trR.value);
      if(!c.length) throw new Error('tab "'+TAB_TRACKER+'" returned no candidate rows');
      const r=(rqR.status==='fulfilled')?buildReqs(rqR.value):SNAPSHOT.reqs;
      C=c; R=r; SRC_MODE='live'; LAST=new Date();
      setStat('live','Live · '+LAST.toLocaleTimeString(),

  const err=(trR.reason&&trR.reason.message)||trR.reason||'unknown error';
  if(SRC_MODE!=='live'){ C=SNAPSHOT.cands; R=SNAPSHOT.reqs; SRC_MODE='snapshot'; rebuildFilters(); render(); }
  setStat(SRC_MODE==='live'?'live':'snap',
    SRC_MODE==='live'?'Live (refresh failed)':'Snapshot '+SNAPSHOT.generated, String(err));
  toast('Could not read the Google Sheet — <b>'+esc(err)+'</b>.<br>Showing the built-in snapshot from '
    +SNAPSHOT.generated+'.<br>Check that the sheet is shared as <b>“Anyone with the link — Viewer”</b> '
    +'and that the tabs are still named <b>“'+esc(TAB_TRACKER)+'”</b> and <b>“'+esc(TAB_REQS)+'”</b>.',11000);
}

/* ---------------- filters ---------------- */
const FDEFS=[
  {id:'ym',   lab:'Period',     key:r=>r.ym||'(no date)', disp:monLab},

];

function apply(){
  return C.filter(r=>FDEFS.every(d=>!F[d.id].size||F[d.id].has(d.key(r)||'(blank)'))
    && (!FQ||(r.name+' '+r.pos+' '+r.code+' '+r.src+' '+r.rec+' '+r.loc).toLowerCase().includes(FQ)));
}
/* Requisitions carry Department, Location, Position and an Owner that uses the same
   recruiter names as the candidate sheet — so Recruiter filters them too.
   Source, Status and Period describe a candidate's journey and have no meaning for a
   requisition, so they are deliberately not applied here. */
function applyR(){
  const dp=F.dept, lc=F.loc, ps=F.pos, rc=F.rec;
  return R.filter(q=>{
    const qd=nrm(q.dept), ql=nrm(q.loc).toLowerCase(), qp=nrm(q.pos).toLowerCase();
    if(dp.size&&![...dp].some(x=>qd?deptMatch(x,qd):x==='(blank)'))return false;
    if(rc.size&&![...rc].some(x=>nrm(q.owner).toLowerCase()===x.toLowerCase()))return false;
    if(lc.size&&![...lc].some(x=>{const a=x.toLowerCase();return !!a&&(ql.includes(a)||a.includes(ql));}))return false;
    if(ps.size&&![...ps].some(x=>{const a=x.toLowerCase();return !!a&&(qp.includes(a)||a.includes(qp));}))return false;
    if(FQ&&!(q.pos+' '+q.code+' '+q.loc+' '+q.owner).toLowerCase().includes(FQ))return false;
    return true;});
}
/* which of the active filters actually reach the requisition sheet */
const RDIMS=['dept','rec','loc','pos'];
const reqFiltered=()=>RDIMS.some(k=>F[k].size)||!!FQ;

/* ---------------- DAYS TO FILL ONE PERSON ----------------
   "How many days does it take us to put one person into this seat?"
   = how long the requisition has been running, divided by how many people were actually
   placed against it. Taken from the requisition sheet, which holds both the opening date
   and the true on-board count (the candidate tracker under-records bulk TFM hiring).
   Requisition life = opening -> closing date if closed, otherwise opening -> today. */
function fillRate(reqs){
  const T=new Date();
  return (reqs||R).map(q=>{
    if(!q.start||!q.onboard)return null;
    const st=new Date(q.start); if(isNaN(st))return null;
    const en=(q.status!=='OPEN'&&q.end&&new Date(q.end)>st)?new Date(q.end):T;
    const elapsed=Math.round((en-st)/864e5);
    if(elapsed<=0)return null;
    return {q, elapsed, per:elapsed/q.onboard};
  }).filter(Boolean);
}
/* per position: total people placed, against the longest-running requisition window */
function fillByPos(reqs){
  const fr=fillRate(reqs);
  return [...grp(fr,x=>x.q.pos)].map(([k,v])=>{
    const onb=sum(v,x=>x.q.onboard), bal=sum(v,x=>x.q.bal), el=Math.max(...v.map(x=>x.elapsed));
    const per=onb?el/onb:null;
    return {k, onb, bal, el, per, proj:per!=null?per*bal:null,
            dept:v[0].q.dept, open:v.some(x=>x.q.status==='OPEN')};
  }).filter(x=>x.per!=null);
}
const fillMedian=reqs=>med(fillRate(reqs).map(x=>x.per));

/* ---------------- matching a candidate to the RIGHT requisition ----------------
   The same job code is raised repeatedly — Fire Marshall VF/002 appears as 7 separate
   requisitions between January and June. Measuring every CV against the earliest of them
   charged months of unrelated waiting to each candidate and inflated the sourcing lag
   roughly threefold. A CV belongs to the most recent requisition opened on or before it. */
function reqIndex(reqs){
  const m={};
  (reqs||R).forEach(q=>{if(q.code&&q.start)(m[q.code]=m[q.code]||[]).push(q.start);});
  Object.values(m).forEach(a=>a.sort());   // ISO dates sort correctly as strings
  return m;
}
function govStart(idx,code,onDate){
  const a=code?idx[code]:null; if(!a||!onDate)return null;
  let best=null;
  for(const s of a){ if(s<=onDate) best=s; else break; }
  return best;                              // null if every requisition post-dates the CV
}

/* ---------------- stage durations on a single, consistent cohort ----------------
   Stage figures used to be computed over different subsets (564 / 200 / 96 rows),
   so they could not be compared and did not reconcile with the total.
   Every stage below is restricted to candidates who completed the whole journey.

   Two cohorts are returned:
     cand — hires with all four candidate dates (CV -> joining)
     req  — the subset that also links to a requisition with a valid opening date,
            giving the full chain requisition -> CV -> interview -> selection -> joining */
function stageStats(rows,reqs){
  const idx=reqIndex(reqs);
  const cand=rows.filter(r=>r.joined&&r.d_cv_iv!=null&&r.d_iv_sel!=null&&r.d_sel_join!=null&&r.d_total!=null);
  const req=[];
  cand.forEach(r=>{
    const s=govStart(idx,r.code,r.cvd); if(!s)return;   // requisition open when this CV arrived
    const d=days(s,r.cvd);
    if(d==null||d<0||d>365)return;
    req.push({...r,d_req_cv:d});
  });
  const g=(arr,k)=>({med:med(arr.map(r=>r[k])), avg:avg(arr.map(r=>r[k]))});
  return {
    n:cand.length, cohort:cand,
    s1:g(cand,'d_cv_iv'), s2:g(cand,'d_iv_sel'), s3:g(cand,'d_sel_join'), tot:g(cand,'d_total'),
    rn:req.length,
    r0:g(req,'d_req_cv'), r1:g(req,'d_cv_iv'), r2:g(req,'d_iv_sel'), r3:g(req,'d_sel_join'),
    rtot:{avg:req.length?avg(req.map(r=>r.d_req_cv+r.d_cv_iv+r.d_iv_sel+r.d_sel_join)):null,
          med:req.length?med(req.map(r=>r.d_req_cv+r.d_cv_iv+r.d_iv_sel+r.d_sel_join)):null},
    linkable:cand.filter(r=>govStart(idx,r.code,r.cvd)).length};
}

/* ---------------- metrics ---------------- */
function M(rows){
  const cv=rows.length, iv=cnt(rows,r=>r.interviewed), sl=cnt(rows,r=>r.selected),
        jn=cnt(rows,r=>r.joined), rt=cnt(rows,r=>r.retained), lf=cnt(rows,r=>r.left),
        ac=cnt(rows,r=>r.active), ls=cnt(rows,r=>r.lost);
  return {cv,iv,sl,jn,rt,lf,ac,ls,
    c2i:pct(iv,cv), i2s:pct(sl,iv), s2j:pct(jn,sl), cv2j:pct(jn,cv),
    drop:pct(sl-jn,sl), perHire:jn?cv/jn:null, attr:pct(lf,jn),
    t1:med(rows.map(r=>r.d_cv_iv)), t2:med(rows.map(r=>r.d_iv_sel)),
    t3:med(rows.map(r=>r.d_sel_join)), tat:med(rows.map(r=>r.d_total))};
}

/* ================= DRILL-THROUGH =================
   Every chart element can carry data-d (which drill) and data-k (which slice of it).
   Charts register a resolver on each render; clicking an element opens the record list. */
let DRILL={}, DCUR=null;
/* id: unique per render · title · get(key) -> array of rows · kind 'cand'|'req' · dim: filter id */
function reg(id,title,get,kind,dim){DRILL[id]={title,get,kind:kind||'cand',dim:dim||null};return id;}

/* "Naukri|joined" -> "Naukri — Joined" for display */
const SEGLAB={joined:'Joined',sel:'Selected, not joined',act:'Still in pipeline',lost:'Rejected / not interested',
  cv:'All CVs',sl:'Selected',jn:'Joined',iv:'Interviewed',nos:'Sanctioned',onb:'On board',bal:'Still open',
  cur:'Current salary',exp:'Expected salary',seats:'Seats still open',pipe:'Candidates in pipeline',
  b1:'waiting 0–14 days',b2:'waiting 15–30 days',b3:'waiting 31–60 days',b4:'waiting 60+ days'};
function keyLabel(key){
  const i=String(key).lastIndexOf('|');
  if(i<0)return key;
  const a=key.slice(0,i), b=key.slice(i+1);
  return a+' — '+(SEGLAB[b]||b);
}
function openDrill(id,key){
  const D=DRILL[id]; if(!D)return;

        {s:r.status,h:statusPill(r.status)},r.cvd||'–',r.ivd||'–',r.seld||'–',r.jd||'–',

/* ---------------- chart primitives ---------------- */
const P=['#4c8dff','#2ecc9b','#f5a524','#ff5c6c','#a78bfa','#22d3ee','#f472b6','#84cc16','#fb923c','#38bdf8'];
const S=(w,h,i)=>`<svg viewBox="0 0 ${w} ${h}" width="100%" style="height:auto;display:block;overflow:visible">${i}</svg>`;
const EMPTY='<div class="empty">No data for the current filters.</div>';

function hbar(items,o){o=o||{};
  if(!items.length)return EMPTY;
  const w=o.w||330, rh=o.rh||20, lw=o.lw||118, vw=o.vw||52, bw=w-lw-vw;
  const mx=Math.max(1,...items.map(i=>i.v));

  let s='';
  items.forEach((it,i)=>{
    const y=i*rh+3, bl=Math.max(2,it.v/mx*bw), c=it.c||o.color||P[i%P.length];
    s+=`<text class="bl" x="${lw-6}" y="${y+11}" text-anchor="end">${esc(cut(it.k,Math.floor(lw/5.6)))}</text>`;
    s+=`<rect x="${lw}" y="${y+2}" width="${bl}" height="${rh-7}" rx="2.5" fill="${c}" opacity=".85"${DA(o,it.dk!=null?it.dk:it.k)}><title>${esc(it.k)}: ${fmt(it.v)}${it.note?' — '+esc(it.note):''}${o.drill?' · click for the list':''}</title></rect>`;
    s+=`<text class="bv" x="${lw+bl+5}" y="${y+11}">${fmt(it.v)}`
      +(o.showNote&&it.note?`<tspan fill="var(--tx3)" font-weight="400" font-size="9.5"> ${esc(it.note)}</tspan>`:'')
      +`</text>`;
  });
  return S(w,items.length*rh+6,s);
}
function ghbar(items,ser,o){o=o||{};
  if(!items.length)return EMPTY;
  const w=o.w||330, rh=o.rh||10, gap=8, lw=o.lw||112, n=ser.length, blk=n*rh+gap, bw=w-lw-46;
  const mx=Math.max(1,...items.flatMap(i=>ser.map(s=>i[s.k]||0)));
  let s='';
  items.forEach((it,i)=>{
    const y0=i*blk+4;
    s+=`<text class="bl" x="${lw-6}" y="${y0+blk/2-1}" text-anchor="end">${esc(cut(it.k,Math.floor(lw/5.6)))}</text>`;
    ser.forEach((se,j)=>{const v=it[se.k]||0,bl=Math.max(1,v/mx*bw),y=y0+j*rh;
      s+=`<rect x="${lw}" y="${y}" width="${bl}" height="${rh-2.5}" rx="1.5" fill="${se.c}" opacity=".9"${DA(o,(it.dk!=null?it.dk:it.k)+'|'+se.k)}><title>${esc(it.k)} — ${se.n}: ${f0(v)}${o.drill?' · click for the list':''}</title></rect>`;
      s+=`<text class="bv" x="${lw+bl+4}" y="${y+rh-3}" font-size="9">${f0(v)}</text>`;});
  });
  return S(w,items.length*blk+6,s)+lgd(ser.map(x=>({n:x.n,c:x.c})));
}
function stack100(items,keys,o){o=o||{};
  if(!items.length)return EMPTY;
  const w=o.w||330, rh=o.rh||19, lw=o.lw||108, bw=w-lw-32;
  let s='';

    const y=i*rh+3, tot=keys.reduce((a,k)=>a+(it[k.k]||0),0)||1; let x=lw;
    s+=`<text class="bl" x="${lw-6}" y="${y+11}" text-anchor="end">${esc(cut(it.k,Math.floor(lw/5.6)))}</text>`;
    keys.forEach(kk=>{const v=it[kk.k]||0; if(!v)return; const bl=v/tot*bw;
      s+=`<rect x="${x}" y="${y+2}" width="${bl}" height="${rh-7}" fill="${kk.c}" opacity=".88"${DA(o,(it.dk!=null?it.dk:it.k)+'|'+kk.k)}><title>${esc(it.k)} — ${kk.n}: ${v} (${f1(v/tot*100)}%)${o.drill?' · click for the list':''}</title></rect>`;
      if(bl>20)s+=`<text x="${x+bl/2}" y="${y+11}" text-anchor="middle" font-size="9" fill="#fff" font-weight="650">${v}</text>`;
      x+=bl;});
    s+=`<text class="bv" x="${x+4}" y="${y+11}" font-size="9" fill="var(--tx3)">${tot}</text>`;

  return S(w,items.length*rh+6,s)+lgd(keys.map(k=>({n:k.n,c:k.c})));

function lines(cats,ser,o){o=o||{};
  if(!cats.length)return EMPTY;
  const w=o.w||330,h=o.h||190,L=34,Rr=10,T=12,B=24,pw=w-L-Rr,ph=h-T-B;
  const mx=Math.max(1,...ser.flatMap(s=>s.v));
  const X=i=>L+(cats.length<2?pw/2:i/(cats.length-1)*pw), Y=v=>T+ph-v/mx*ph;
  let s='';
  for(let g=0;g<=3;g++){const y=T+ph-g/3*ph;
    s+=`<line class="gl" x1="${L}" y1="${y}" x2="${w-Rr}" y2="${y}"/>`+
       `<text x="${L-5}" y="${y+3}" text-anchor="end" font-size="9" fill="var(--tx3)">${f0(mx*g/3)}</text>`;}
  cats.forEach((c,i)=>s+=`<text x="${X(i)}" y="${h-8}" text-anchor="middle" font-size="9" fill="var(--tx3)">${esc(c)}</text>`);
  ser.forEach(se=>{
    s+=`<polyline fill="none" stroke="${se.c}" stroke-width="2" stroke-linejoin="round" points="${se.v.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>`;
    se.v.forEach((v,i)=>{s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="2.8" fill="${se.c}"><title>${se.n} ${cats[i]}: ${f0(v)}</title></circle>`;});
  });
  return S(w,h,s)+lgd(ser);
}
function donut(items,o){o=o||{};
  items=items.filter(i=>i.v>0);
  if(!items.length)return EMPTY;
  const tot=sum(items,i=>i.v)||1, w=o.w||330, cx=80, r=62, ir=38;
  const legH=items.length*15.5+10, h=Math.max(o.h||178,legH);
  const cy=h/2;
  let a0=-Math.PI/2,s='';
  // slices, each separated by a background-coloured stroke so adjacent colours never merge
  items.forEach((it,i)=>{
    const a1=a0+it.v/tot*Math.PI*2, la=(a1-a0)>Math.PI?1:0, c=it.c||P[i%P.length];
    const p=(rr,a)=>[cx+rr*Math.cos(a),cy+rr*Math.sin(a)];
    const[x1,y1]=p(r,a0),[x2,y2]=p(r,a1),[x3,y3]=p(ir,a1),[x4,y4]=p(ir,a0);
    s+=`<path d="M${x1},${y1} A${r},${r} 0 ${la},1 ${x2},${y2} L${x3},${y3} A${ir},${ir} 0 ${la},0 ${x4},${y4} Z" `
      +`fill="${c}" stroke="var(--pnl)" stroke-width="1.5"${DA(o,it.dk!=null?it.dk:it.k)}><title>${esc(it.k)}: ${it.v} (${f1(it.v/tot*100)}%)${o.drill?' · click for the list':''}</title></path>`;
    a0=a1;});
  s+=`<text x="${cx}" y="${cy-1}" text-anchor="middle" font-size="19" font-weight="700" fill="var(--tx)">${f0(tot)}</text>`;
  s+=`<text x="${cx}" y="${cy+13}" text-anchor="middle" font-size="9" fill="var(--tx3)">total</text>`;
  // legend with swatch, label, count and share
  items.forEach((it,i)=>{const y=13+i*15.5, c=it.c||P[i%P.length];
    s+=`<rect x="166" y="${y-8}" width="9" height="9" rx="2.5" fill="${c}"/>`;
    s+=`<text x="180" y="${y}" font-size="10" fill="var(--tx2)">${esc(cut(it.k,16))}</text>`;
    s+=`<text x="${w-30}" y="${y}" font-size="10" text-anchor="end" fill="var(--tx)" font-weight="650">${it.v}</text>`;
    s+=`<text x="${w-2}" y="${y}" font-size="9" text-anchor="end" fill="var(--tx3)">${f1(it.v/tot*100)}%</text>`;});
  return S(w,h,s);
}

/* horizontal stacked bar — used for the stage breakdown, where the parts must sum to the whole */
function stackBar(segs,o){o=o||{};
  const w=o.w||330, tot=sum(segs,s=>s.v)||1, bw=w-10, y=8, bh=30;
  let x=5,s='';
  segs.forEach((sg,i)=>{const bl=Math.max(3,sg.v/tot*bw);   // keep tiny stages visible
    s+=`<rect x="${x}" y="${y}" width="${bl}" height="${bh}" fill="${sg.c}" stroke="var(--pnl)" stroke-width="1"><title>${esc(sg.n)}: ${f1(sg.v)} days (${f1(sg.v/tot*100)}%)</title></rect>`;
    if(bl>32)s+=`<text x="${x+bl/2}" y="${y+19}" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">${f1(sg.v)}d</text>`;
    x+=bl;});
  s+=`<text x="5" y="${y+bh+16}" font-size="10" fill="var(--tx3)">0 days</text>`;
  s+=`<text x="${w-5}" y="${y+bh+16}" font-size="10" text-anchor="end" fill="var(--tx)" font-weight="650">${f1(tot)} days total</text>`;
  return S(w,y+bh+24,s)+lgd(segs.map(sg=>({n:sg.n,c:sg.c})));
}
function funnel(steps,o){o=o||{};
  const w=o.w||330, rh=o.rh||40, bw=w-108, mx=steps[0].v||1;
  let s='';
  steps.forEach((st,i)=>{
    const y=i*rh+4, bl=Math.max(3,st.v/mx*bw), c=P[i%P.length];
    s+=`<rect x="88" y="${y}" width="${bl}" height="${rh-13}" rx="3" fill="${c}" opacity=".85"${DA(o,st.dk!=null?st.dk:st.k)}><title>${esc(st.k)}: ${f0(st.v)}${o.drill?' · click for the list':''}</title></rect>`;
    s+=`<text class="bl" x="82" y="${y+12}" text-anchor="end" font-weight="650" fill="var(--tx)">${esc(st.k)}</text>`;
    s+=`<text class="bv" x="${88+bl+5}" y="${y+13}" font-size="12.5" font-weight="700">${f0(st.v)}</text>`;
    if(i>0){const p=steps[i-1].v?st.v/steps[i-1].v*100:0;
      const col=p>=60?'var(--a2)':p>=35?'var(--a3)':'var(--a4)';
      s+=`<text x="88" y="${y+rh-4}" font-size="9.5" fill="${col}" font-weight="650">${f1(p)}% forward · ${f0(steps[i-1].v-st.v)} lost</text>`;}
  });
  return S(w,steps.length*rh+4,s);
}
const lgd=ss=>'<div class="lgd">'+ss.map(s=>`<span><i style="background:${s.c}"></i>${esc(s.n)}</span>`).join('')+'</div>';

/* ---------------- table ---------------- */
let SORT={};
function tbl(id,cols,rows){
  const st=SORT[id];
  if(st){rows=[...rows].sort((a,b)=>{
    const x=a[st.i],y=b[st.i], nx=(x&&typeof x==='object')?x.s:x, ny=(y&&typeof y==='object')?y.s:y;
    if(typeof nx==='number'&&typeof ny==='number')return (nx-ny)*st.d;
    return String(nx==null?'':nx).localeCompare(String(ny==null?'':ny))*st.d;});}
  return '<table><thead><tr>'+cols.map((c,i)=>
    `<th class="${c.n?'n':''}${c.w?' w':''}" onclick="srt('${id}',${i})">${esc(c.t)}${st&&st.i===i?(st.d>0?' ▲':' ▼'):''}</th>`).join('')
    +'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map((c,i)=>{
      const v=r[i]; return `<td class="${c.n?'n':''}${c.w?' w':''}">${(v&&typeof v==='object')?v.h:esc(v==null?'–':v)}</td>`;}).join('')+'</tr>').join('')
    +'</tbody></table>';
}
function srt(id,i){const s=SORT[id];SORT[id]=(s&&s.i===i)?{i,d:-s.d}:{i,d:-1};render();}
const nv=(v,cls,fmt)=>({s:v==null?-1e15:v,h:`<span class="${cls||''}">${v==null?'–':(fmt?fmt(v):f0(v))}</span>`});

function render(){
  const d=apply(), m=M(d), rq=applyR();
  DRILL={};                       // resolvers close over the currently filtered data
  const STAGE={CVs:()=>d, Interviewed:()=>d.filter(r=>r.interviewed), Selected:()=>d.filter(r=>r.selected),
               Joined:()=>d.filter(r=>r.joined), Retained:()=>d.filter(r=>r.retained)};
  reg('stage','{k}',k=>(STAGE[k]||(()=>[]))());
  reg('conv','{k}',k=>({
    'CV → Interview':()=>d.filter(r=>r.interviewed),
    'Interview → Selection':()=>d.filter(r=>r.selected),
    'Selection → Joining':()=>d.filter(r=>r.joined),
    'CV → Joining (overall)':()=>d.filter(r=>r.joined)}[k]||(()=>[]))());
  reg('src','Source: {k}',k=>d.filter(r=>r.src===k),'cand','src');
  reg('rec','Recruiter: {k}',k=>d.filter(r=>r.rec===k),'cand','rec');
  reg('pos','Position: {k}',k=>d.filter(r=>r.pos===k),'cand','pos');
  reg('dept','Department: {k}',k=>d.filter(r=>r.dept===k),'cand','dept');
  reg('status','Status: {k}',k=>d.filter(r=>r.status===k),'cand','status');
  reg('panel','Interviewer: {k}',k=>d.filter(r=>r.panel===k));
  reg('mode','Interview mode: {k}',k=>d.filter(r=>r.mode===k));
  reg('posreq','Requisitions: {k}',k=>rq.filter(q=>q.pos===k),'req');
  reg('deptreq','Requisitions — {k}',k=>rq.filter(q=>(q.dept||'(blank)')===k),'req');
  reg('ownerreq','Open requisitions — {k}',k=>rq.filter(q=>q.status==='OPEN'&&q.owner===k),'req');
  // combined key "<group>|<outcome>" used by the stacked / grouped charts
  const OUT={joined:r=>r.joined, sel:r=>r.selected&&!r.joined, act:r=>r.active&&!r.selected, lost:r=>r.lost,
             cv:()=>true, sl:r=>r.selected, jn:r=>r.joined, iv:r=>r.interviewed};
  const split=(k,f)=>{const i=k.lastIndexOf('|');return [k.slice(0,i),k.slice(i+1)];};
  reg('srcout','Source: {k}',k=>{const[a,b]=split(k);return d.filter(r=>r.src===a&&(OUT[b]||(()=>true))(r));});
  reg('recout','Recruiter: {k}',k=>{const[a,b]=split(k);return d.filter(r=>r.rec===a&&(OUT[b]||(()=>true))(r));});
  reg('modeout','Mode: {k}',k=>{const[a,b]=split(k);return d.filter(r=>r.mode===a&&(OUT[b]||(()=>true))(r));});
  reg('deptout','Department: {k}',k=>{const[a,b]=split(k);return d.filter(r=>r.dept===a&&(OUT[b]||(()=>true))(r));});
  reg('deptreqout','Requisitions — {k}',k=>{const[a]=split(k);return rq.filter(q=>(q.dept||'(blank)')===a);},'req');
  // band-based drills — keys must match the chart labels exactly
  const T0=new Date(), agef=r=>Math.round((T0-new Date(r.cvd))/864e5);
  const BB={b1:[0,14],b2:[15,30],b3:[31,60],b4:[61,1e5]};
  reg('backlog','Pipeline — {k}',k=>{const[a,b]=split(k), rg=BB[b]; if(!rg)return [];
    return d.filter(r=>r.active&&r.cvd&&r.rec===a&&agef(r)>=rg[0]&&agef(r)<=rg[1]);});
  reg('gappos','Selection → joining — {k}',k=>d.filter(r=>r.pos===k&&r.joined&&r.d_sel_join!=null));
  reg('deptcov','{k}',k=>{const[a,b]=split(k);
    return b==='seats'?rq.filter(q=>q.status==='OPEN'&&(q.dept||'(blank)')===a)
                      :d.filter(r=>r.active&&deptMatch(r.dept,a));},
    k=>k.endsWith('|seats')?'req':'cand');
  reg('drop','Offer drop-off — {k}',k=>d.filter(r=>r.pos===k&&r.selected&&!r.joined));
  const RAGE={'Under 30 days':[0,30],'1–3 months':[30,90],'3–6 months':[90,180],
              '6–12 months':[180,365],'Over a year':[365,1e6]};
  reg('reqage','Open requisitions — {k}',k=>{const b=RAGE[k]; if(!b)return [];
    return rq.filter(q=>q.status==='OPEN'&&q.age!=null&&q.age>=b[0]&&q.age<b[1]);},'req');
  const HB={'Cut / same':[-1e4,0],'0–10%':[0,10],'10–20%':[10,20],'20–30%':[20,30],
            '30–50%':[30,50],'Over 50%':[50,1e6]};
  reg('hike','Hike {k}',k=>{const b=HB[k]; if(!b)return [];
    return d.filter(r=>r.hike!=null&&r.hike>b[0]&&r.hike<=b[1]);});
  const SB={'< ₹15k':[0,15000],'₹15–25k':[15000,25000],'₹25–35k':[25000,35000],
            '₹35–50k':[35000,50000],'₹50k+':[50000,1e9]};
  reg('salband','Current salary {k}',k=>{const b=SB[k]; if(!b)return [];
    return d.filter(r=>r.cs!=null&&r.cs>=b[0]&&r.cs<b[1]);});
  reg('outcome','{k}',k=>({
    'Joined':()=>d.filter(r=>r.joined&&r.hike!=null),
    'Selected, not joined':()=>d.filter(r=>r.selected&&!r.joined&&r.hike!=null),
    'Still in pipeline':()=>d.filter(r=>r.active&&!r.selected&&r.hike!=null),
    'Rejected / not interested':()=>d.filter(r=>r.lost&&r.hike!=null)}[k]||(()=>[]))());
  PAGES.forEach(([id])=>document.getElementById('tb_'+id).classList.toggle('on',id===PAGE));
  document.getElementById('meta').textContent=
    (SRC_MODE==='live'?'Live from Google Sheets':'Snapshot '+SNAPSHOT.generated);
  document.getElementById('fcount').textContent=
    f0(d.length)+' of '+f0(C.length)+' candidates · '
    +(reqFiltered()?f0(rq.length)+' of '+f0(R.length):f0(rq.length))+' requisitions';
  document.getElementById('fcount').title=
    'Department, Recruiter, Location and Position filter both sheets. '
    +'Source, Status and Period apply to candidates only — a requisition has no source or status of its own.';
  kstrip(d,m,rq);
  document.getElementById('kfs').innerHTML=insights(d,m,rq).map(i=>
    `<div class="kfc" style="--c:${i.c}"><div class="t">${i.t}</div><div class="d">${i.d}</div></div>`).join('')
    ||'<div class="kfc" style="--c:var(--tx3)"><div class="d">Nothing notable in the current selection.</div></div>';
  document.getElementById('grid').innerHTML=
    PAGE==='ov'?pgOv(d,m,rq):PAGE==='fn'?pgFn(d,m):PAGE==='roi'?pgRoi(d,m):
    PAGE==='pos'?pgPos(d,m,rq):PAGE==='sal'?pgSal(d,m):pgRec(d);
}
function kstrip(d,m,rq){
  const open=rq.filter(q=>q.status==='OPEN'), fpm=fillMedian(rq);
  const K=[
    ['CVs received',f0(m.cv),'candidates screened','var(--a1)'],
    ['Interviewed',f0(m.iv),f1(m.c2i)+'% of CVs','var(--a6)'],
    ['Reached selection',f0(m.sl),'incl. those who joined · '+f1(m.i2s)+'% of interviewed','var(--a3)'],
    /* the two are mutually exclusive — 'Joined' counts only those still with the company */
    ['Joined',f0(m.rt),'still with us · '+f1(pct(m.rt,m.cv))+'% of CVs','var(--a2)'],
    ['Joined & left',f0(m.lf),m.jn?f1(m.attr)+'% of '+f0(m.jn)+' total hires':'no hires yet','var(--a4)'],
    ['In pipeline',f0(m.ac),'awaiting decision','var(--a5)'],
    ['Offer drop-off',f1(m.drop)+'%',f0(m.sl-m.jn)+' never joined','var(--a3)'],
    ['Open positions',f0(sum(open,q=>q.bal)),open.length+' open requisitions','var(--a7)'],
    ['Days to fill one',fpm==null?'–':f1(fpm)+' d','median, per person placed','var(--a8)'],
  ];
  document.getElementById('kstrip').innerHTML=K.map(([l,v,n,c])=>
    `<div class="kc" style="--c:${c}"><div class="l">${l}</div><div class="v">${v}</div><div class="n">${n}</div></div>`).join('');
}

/* ---- page: overview ----
   Each visual here appears nowhere else in the dashboard. */
function pgOv(d,m,rq){
  const ms=uniq(d.map(r=>r.ym));
  const srcG=[...grp(d,r=>r.src)].map(([k,v])=>({k,cv:v.length,jn:cnt(v,r=>r.joined)}));
  const stG=[...grp(d,r=>r.status)].map(([k,v])=>({k:stLabel(k),dk:k,v:v.length,c:stColor(k),rk:stRank(k)}))
    .sort((a,b)=>a.rk-b.rk);           // ordered by position in the process, not by size
  const dG=[...grp(rq,q=>q.dept||'(blank)')].map(([k,v])=>({k,nos:sum(v,q=>q.nos),onb:sum(v,q=>q.onboard),bal:sum(v,q=>q.bal)}))
    .sort((a,b)=>b.nos-a.nos);

  // ---- days to fill ONE person, per position ----
  const fp=fillByPos(rq);
  const perPos=[...fp].sort((a,b)=>b.per-a.per).slice(0,11)
    .map(x=>({k:x.k,v:x.per,note:x.onb+' placed'}));
  const proj=fp.filter(x=>x.open&&x.bal>0).sort((a,b)=>b.proj-a.proj).slice(0,11)
    .map(x=>({k:x.k,v:x.proj,note:x.bal+' seats left'}));
  const usable=fillRate(rq).length;
  const fillNote=usable
    ? `Requisition running time ÷ people actually placed. Based on ${usable} of ${rq.length} requisitions — the rest have no opening date or nobody on board yet.`
    : 'No requisition has both an opening date and someone on board.';

  // open seats against candidates still live, per department
  const dnames=uniq([...rq.map(q=>q.dept||'(blank)'),...d.map(r=>r.dept)]);
  const cover=dnames.map(k=>({k,
    seats:sum(rq.filter(q=>q.status==='OPEN'&&(q.dept||'(blank)')===k),q=>q.bal),
    pipe:cnt(d,r=>r.active&&deptMatch(r.dept,k))}))
    .filter(x=>x.seats||x.pipe).sort((a,b)=>b.seats-a.seats);

  return [
    tile('Hiring funnel','Every CV in the tracker and where it ended up',
      funnel([{k:'CVs',v:m.cv},{k:'Interviewed',v:m.iv},{k:'Reached selection',dk:'Selected',v:m.sl},
              {k:'Joined',v:m.jn},{k:'Still with us',dk:'Retained',v:m.rt}],{drill:'stage'})),
    tile('CVs vs selected vs joined','By month the CV was received',
      lines(ms.map(x=>monLab(x,1)),[{n:'CVs',c:P[0],v:ms.map(x=>cnt(d,r=>r.ym===x))},
        {n:'Reached selection',c:P[2],v:ms.map(x=>cnt(d,r=>r.ym===x&&r.selected))},
        {n:'Joined',c:P[1],v:ms.map(x=>cnt(d,r=>r.ym===x&&r.joined))}])),
    tile('Days to fill one person','How many days it takes to put a single person into this role',
      (perPos.length?hbar(perPos,{fmt:v=>f1(v)+' d',color:P[4],lw:126,drill:'posreq'}):EMPTY),
      '',fillNote),
    tile('Projected days to fill the seats still open','Days to fill one person × seats remaining, for open requisitions',
      (proj.length?hbar(proj,{fmt:v=>f0(v)+' d',color:P[3],lw:126,drill:'posreq'}):EMPTY),
      '','Projected at the pace this role has hired so far. Anything beyond about 90 days will not close by waiting — it needs a different channel, a revised specification or a pay-band review.'),
    tile('Source mix of hires','Share of everyone who joined, by the channel they came from',
      (m.jn?hbar(srcG.filter(s=>s.jn>0).map(s=>({k:s.k,v:pct(s.jn,m.jn),note:s.jn+' of '+m.jn})).sort((a,b)=>b.v-a.v),
        {fmt:v=>f1(v)+'%',color:P[1],drill:'src'}):EMPTY),
      '','Measured against the '+f0(m.jn)+' people who actually joined, so these shares add up to 100%. '
        +'This says where your hires come from — it does not say which channel is most efficient, '
        +'because a channel that sends a huge volume of CVs will rank high here even with a poor conversion rate.'),
    tile('Requisition fill status by department','Sanctioned headcount vs on board vs still open',
      ghbar(dG,[{k:'nos',n:'Sanctioned',c:P[0]},{k:'onb',n:'On board',c:P[1]},{k:'bal',n:'Still open',c:P[3]}],{drill:'deptreqout'})),
    tile('Candidate status mix','Click a slice for the list',donut(stG,{drill:'status'})),
    tile('Open seats vs live pipeline','Whether there are enough candidates in play to fill what is open',
      ghbar(cover,[{k:'seats',n:'Seats still open',c:P[3]},{k:'pipe',n:'Candidates in pipeline',c:P[0]}],{drill:'deptcov'}),
      '','A department with open seats and little or no pipeline will not fill by waiting — it needs fresh sourcing. Seats come from open requisitions; pipeline counts candidates not yet rejected or joined.'),
  ].join('');
}

/* ---- page: funnel ---- */
function pgFn(d,m){
  const ms=uniq(d.map(r=>r.ym));
  const open=d.filter(r=>r.active&&r.cvd), T=new Date();
  const age=r=>Math.round((T-new Date(r.cvd))/864e5);
  const backlog=[...grp(open,r=>r.rec)].map(([k,v])=>({k,
    b1:cnt(v,r=>age(r)<=14), b2:cnt(v,r=>age(r)>14&&age(r)<=30),
    b3:cnt(v,r=>age(r)>30&&age(r)<=60), b4:cnt(v,r=>age(r)>60)}))
    .sort((a,b)=>(b.b1+b.b2+b.b3+b.b4)-(a.b1+a.b2+a.b3+a.b4));
  const gap=[...grp(d.filter(r=>r.joined&&r.d_sel_join!=null),r=>r.pos)]
    .map(([k,v])=>({k,v:med(v.map(r=>r.d_sel_join)),note:v.length+' hire'+(v.length>1?'s':'')}))
    .sort((a,b)=>b.v-a.v).slice(0,11);
  // live candidates at each step, in process order, with how long they have been waiting
  const waiting=WAITING.map(s=>{
    const v=d.filter(r=>r.status===s);
    if(!v.length)return null;
    const ages=v.filter(r=>r.cvd).map(r=>age(r));
    const old=cnt(v,r=>r.cvd&&age(r)>60);
    return {k:stLabel(s),dk:s,v:v.length,c:stColor(s),
      note:(ages.length?'med '+f0(med(ages))+'d waiting':'')+(old?' · '+old+' over 60d':'')};
  }).filter(Boolean);
  const dropG=[...grp(d.filter(r=>r.selected),r=>r.pos)].map(([k,v])=>({k,sl:v.length,jn:cnt(v,r=>r.joined)}))
    .filter(x=>x.sl-x.jn>0).sort((a,b)=>(b.sl-b.jn)-(a.sl-a.jn)).slice(0,10);
  const ss=stageStats(d,applyR());
  const lostAt=[
    {k:'Never interviewed',v:cnt(d,r=>r.lost&&!r.interviewed)},
    {k:'After interview, not selected',v:cnt(d,r=>r.lost&&r.interviewed&&!r.selected)},
    {k:'After selection (offer drop)',v:m.sl-m.jn},
    {k:'Joined then left',v:m.lf}];
  return [
    tile('Stage conversion rates','What share survives each step',
      hbar([{k:'CV → Interview',v:m.c2i},{k:'Interview → Selection',v:m.i2s},
            {k:'Selection → Joining',v:m.s2j},{k:'CV → Joining (overall)',v:m.cv2j}],
        {fmt:v=>f1(v)+'%',rh:28,lw:132,drill:'conv'})),
    tile('Time to hire — requisition through to joining',
      ss.rn?`Average days across the ${ss.rn} hires traceable from the requisition that raised them — the parts add up to the total`
           :(ss.n?`No hire could be traced back to a requisition; showing the candidate stages only (${ss.n} hires)`
                :'No completed hires with all dates in this selection'),
      ss.rn
        ? stackBar([{n:'Requisition → CV',v:ss.r0.avg,c:P[4]},
                    {n:'CV → Interview',v:ss.r1.avg,c:P[0]},
                    {n:'Interview → Selection',v:ss.r2.avg,c:P[2]},
                    {n:'Selection → Joining',v:ss.r3.avg,c:P[1]}])
          +tbl('t_stg',[{t:'Stage'},{t:'Average',n:1},{t:'Median',n:1},{t:'Share',n:1}],
            [['Requisition → CV',nv(ss.r0.avg,'r',v=>f1(v)+' d'),nv(ss.r0.med,'',v=>f1(v)+' d'),nv(pct(ss.r0.avg,ss.rtot.avg),'r',v=>f0(v)+'%')],
             ['CV → Interview',nv(ss.r1.avg,'',v=>f1(v)+' d'),nv(ss.r1.med,'',v=>f1(v)+' d'),nv(pct(ss.r1.avg,ss.rtot.avg),'',v=>f0(v)+'%')],
             ['Interview → Selection',nv(ss.r2.avg,'',v=>f1(v)+' d'),nv(ss.r2.med,'',v=>f1(v)+' d'),nv(pct(ss.r2.avg,ss.rtot.avg),'',v=>f0(v)+'%')],
             ['Selection → Joining',nv(ss.r3.avg,'',v=>f1(v)+' d'),nv(ss.r3.med,'',v=>f1(v)+' d'),nv(pct(ss.r3.avg,ss.rtot.avg),'',v=>f0(v)+'%')],
             ['Total requisition → joined',nv(ss.rtot.avg,'g',v=>f1(v)+' d'),nv(ss.rtot.med,'g',v=>f1(v)+' d'),'100%'],
             ['— candidate side only (CV → joined)',nv(ss.tot.avg,'',v=>f1(v)+' d'),nv(ss.tot.med,'',v=>f1(v)+' d'),
              {s:-1,h:`<span style="color:var(--tx3)">${ss.n} hires</span>`}]])
        : ss.n
          ? stackBar([{n:'CV → Interview',v:ss.s1.avg,c:P[0]},
                      {n:'Interview → Selection',v:ss.s2.avg,c:P[2]},
                      {n:'Selection → Joining',v:ss.s3.avg,c:P[1]}])
            +tbl('t_stg',[{t:'Stage'},{t:'Average',n:1},{t:'Median',n:1}],
              [['CV → Interview',nv(ss.s1.avg,'',v=>f1(v)+' d'),nv(ss.s1.med,'',v=>f1(v)+' d')],
               ['Interview → Selection',nv(ss.s2.avg,'',v=>f1(v)+' d'),nv(ss.s2.med,'',v=>f1(v)+' d')],
               ['Selection → Joining',nv(ss.s3.avg,'',v=>f1(v)+' d'),nv(ss.s3.med,'',v=>f1(v)+' d')],
               ['Total CV → Joining',nv(ss.tot.avg,'g',v=>f1(v)+' d'),nv(ss.tot.med,'g',v=>f1(v)+' d')]])
          : EMPTY,
      '',
      'Each CV is measured against the most recent requisition opened on or before it, not the first one ever raised for that job code — the same code is re-raised repeatedly (Fire Marshall has 7 separate requisitions), and using the earliest tripled this figure. '
      +'Averages sum to the total; medians do not — a property of medians, not an error. '
      +'Of '+ss.n+' completed hires, '+ss.rn+' trace back to a requisition with a usable opening date. The last row uses all '+ss.n+' hires.'),
    tile('Pipeline backlog by recruiter','Live candidates each recruiter is holding, by how long they have waited',
      stack100(backlog,[{k:'b1',n:'0–14 days',c:P[1]},{k:'b2',n:'15–30 days',c:P[2]},
        {k:'b3',n:'31–60 days',c:P[8]},{k:'b4',n:'60+ days',c:P[3]}],{rh:24,drill:'backlog'}),
      '','Anything past 30 days is realistically cold — most of those candidates have already accepted something else. A recruiter with a large amber and red share is carrying a backlog they cannot convert, which also inflates the reported pipeline.'),
    tile('Notice-period gap by position','Median days between selecting someone and them actually starting',
      hbar(gap,{fmt:v=>f1(v)+' d',color:P[5],lw:132,drill:'gappos'}),
      '','This is the window in which counter-offers land and candidates disappear. Roles with the longest gap are where offer drop-off is most likely, so they are the ones worth chasing weekly during notice.'),
    tile('Monthly funnel','CVs, interviews, selections and joins by month',
      tbl('t_mon',[{t:'Month'},{t:'CVs',n:1},{t:'Interviewed',n:1},{t:'Reached selection',n:1},{t:'Joined',n:1},
        {t:'CV→Join',n:1},{t:'Drop-off',n:1},{t:'Median days CV→join',n:1}],
        ms.map(x=>{const g=d.filter(r=>r.ym===x),mm=M(g);
          return [{s:x,h:esc(monLab(x))},mm.cv,mm.iv,mm.sl,nv(mm.jn,'g'),nv(mm.cv2j,mm.cv2j>=15?'g':'r',v=>f1(v)+'%'),
                  nv(mm.sl?mm.drop:null,mm.drop>40?'r':'',v=>f1(v)+'%'),nv(mm.tat)];}))),
    tile('Conversion rate by month','Is the funnel getting better or worse?',
      lines(ms.map(x=>monLab(x,1)),[
        {n:'CV → Join %',c:P[1],v:ms.map(x=>{const g=d.filter(r=>r.ym===x);return pct(cnt(g,r=>r.joined),g.length);})},
        {n:'Offer drop-off %',c:P[3],v:ms.map(x=>{const g=d.filter(r=>r.ym===x),s=cnt(g,r=>r.selected);return pct(s-cnt(g,r=>r.joined),s);})}])),
    tile('Biggest offer drop-off by position','Selected but never joined — the most expensive loss',
      hbar(dropG.map(x=>({k:x.k,v:x.sl-x.jn,note:x.sl+' selected'})),{color:P[3],drill:'drop'})),
    tile('Who is waiting, and how long','Live candidates at each step of the process, in order',
      hbar(waiting,{rh:27,lw:150,vw:150,drill:'status',fmt:f0,showNote:1}),
      '','Status is a timeline — it moves as the candidate progresses, so this is where everyone sits right now. '
      +'The note on each bar is the median days that group has been waiting since their CV arrived. '
      +'Shortlisted means interviewed and awaiting a yes/no, so a large, old Shortlisted group is a decision backlog rather than a sourcing problem.'),
  ].join('');
}

/* ---- page: recruiter & source ROI ---- */
function pgRoi(d,m){
  const ms=uniq(d.map(r=>r.ym));
  const rec=[...grp(d,r=>r.rec)].map(([k,v])=>({k,...M(v)})).sort((a,b)=>b.cv-a.cv);
  const src=[...grp(d,r=>r.src)].map(([k,v])=>({k,...M(v)})).sort((a,b)=>b.cv-a.cv);
  const pan=[...grp(d,r=>r.panel)].map(([k,v])=>({k,...M(v)})).filter(p=>p.iv>0).sort((a,b)=>b.iv-a.iv);
  const mix=src.filter(s=>s.cv>=5).slice(0,11).map(s=>{const g=d.filter(r=>r.src===s.k);
    return {k:s.k,joined:cnt(g,r=>r.joined),sel:cnt(g,r=>r.selected&&!r.joined),
            act:cnt(g,r=>r.active&&!r.selected),lost:cnt(g,r=>r.lost)};});
  const recMix=rec.slice(0,8).map(s=>{const g=d.filter(r=>r.rec===s.k);
    return {k:s.k,joined:cnt(g,r=>r.joined),sel:cnt(g,r=>r.selected&&!r.joined),
            act:cnt(g,r=>r.active&&!r.selected),lost:cnt(g,r=>r.lost)};});
  return [
    tile('Recruiter scorecard','Volume is easy — conversion and speed are the real measures','<div>'+
      tbl('t_rec',[{t:'Recruiter'},{t:'CVs',n:1},{t:'Reached sel.',n:1},{t:'Joined',n:1},{t:'Open',n:1},{t:'CV→Join',n:1},{t:'Sel→Join',n:1},{t:'CVs per hire',n:1},{t:'Median days CV→join',n:1}],
        rec.map(r=>[r.k,r.cv,r.sl,nv(r.jn,'g'),nv(r.ac,'o'),
          nv(r.cv2j,r.cv2j>=15?'g':r.cv2j<8?'r':'',v=>f1(v)+'%'),
          nv(r.sl?r.s2j:null,r.s2j>=60?'g':r.s2j<40?'r':'',v=>f1(v)+'%'),
          nv(r.perHire,'',v=>f1(v)),nv(r.tat)]))+'</div>'),
    tile('Source scorecard','CV→Join % is the true yield of a channel','<div>'+
      tbl('t_src',[{t:'Source'},{t:'CVs',n:1},{t:'Reached sel.',n:1},{t:'Joined',n:1},{t:'Left',n:1},{t:'CV→Join',n:1},{t:'CVs per hire',n:1}],
        src.map(r=>[r.k,r.cv,r.sl,nv(r.jn,'g'),nv(r.lf,r.lf?'r':''),
          nv(r.cv2j,r.cv2j>=20?'g':r.cv2j<5?'r':'',v=>f1(v)+'%'),
          nv(r.perHire,r.perHire>15?'r':'',v=>f1(v))]))+'</div>'),
    tile('Recruiter: effort vs result','A tall blue bar with a short green bar means effort is not converting',
      ghbar(rec.slice(0,8),[{k:'cv',n:'CVs handled',c:P[0]},{k:'sl',n:'Reached selection',c:P[2]},
        {k:'jn',n:'Joined',c:P[1]}],{drill:'recout'}),
      '','"Reached selection" counts everyone who got to selection or beyond, which necessarily includes those who went on to join. '
        +'Where the two bars are equal it means every candidate that recruiter put forward for selection actually joined — a perfect conversion, not a duplicate.'),
    tile('Hires per recruiter, by month','Who is actually closing, and when',
      lines(ms.map(x=>monLab(x,1)),
        rec.slice(0,4).map((rr,i)=>({n:rr.k,c:P[i],v:ms.map(x=>cnt(d,r=>r.ym===x&&r.rec===rr.k&&r.joined))})))),
    tile('Outcome mix by source','Share of each channel\'s candidates by final outcome',
      stack100(mix,[{k:'joined',n:'Joined',c:P[1]},{k:'sel',n:'Sel, not joined',c:P[2]},
        {k:'act',n:'In pipeline',c:P[0]},{k:'lost',n:'Lost',c:P[3]}],{drill:'srcout'})),
    tile('Outcome mix by recruiter','Same view, per recruiter',
      stack100(recMix,[{k:'joined',n:'Joined',c:P[1]},{k:'sel',n:'Sel, not joined',c:P[2]},
        {k:'act',n:'In pipeline',c:P[0]},{k:'lost',n:'Lost',c:P[3]}],{drill:'recout'})),
    tile('Median time to hire by recruiter','Days from CV received to joining date',
      hbar(rec.filter(r=>r.tat!=null).map(r=>({k:r.k,v:r.tat})).sort((a,b)=>b.v-a.v),{fmt:v=>f1(v)+' d',color:P[5],rh:24,drill:'rec'})),
    tile('Interview panel load','Who interviews, and how selective they are','<div>'+
      tbl('t_pan',[{t:'Interviewer'},{t:'Interviews',n:1},{t:'Reached sel.',n:1},{t:'Joined',n:1},{t:'Selection rate',n:1}],
        pan.map(p=>[p.k,p.iv,p.sl,nv(p.jn,'g'),nv(pct(p.sl,p.iv),'',v=>f1(v)+'%')]))+'</div>'),
  ].join('');
}

/* ---- page: positions ---- */
function pgPos(d,m,rq){
  const pg=[...grp(d,r=>r.pos)].map(([k,v])=>({k,code:v[0].code,dept:v[0].dept,...M(v)})).sort((a,b)=>b.cv-a.cv);
  const od=rq.filter(q=>q.overdue).sort((a,b)=>(b.age||0)-(a.age||0));
  const opn=rq.filter(q=>q.status==='OPEN'&&q.age!=null);
  const agB=[[0,30,'Under 30 days'],[30,90,'1–3 months'],[90,180,'3–6 months'],
             [180,365,'6–12 months'],[365,1e6,'Over a year']]
    .map(([lo,hi,lab])=>({k:lab,v:cnt(opn,q=>q.age>=lo&&q.age<hi),
      note:cnt(opn,q=>q.age>=lo&&q.age<hi)?sum(opn.filter(q=>q.age>=lo&&q.age<hi),q=>q.bal)+' seats':''}));
  const own=[...grp(rq.filter(q=>q.status==='OPEN'),q=>q.owner)].map(([k,v])=>({k,v:sum(v,q=>q.bal)})).sort((a,b)=>b.v-a.v);

  const dep=[...grp(d,r=>r.dept)].map(([k,v])=>({k,cv:v.length,sl:cnt(v,r=>r.selected),jn:cnt(v,r=>r.joined)})).sort((a,b)=>b.cv-a.cv);
  return [
    tile('CVs received per position','Where sourcing effort is going',
      hbar(pg.slice(0,12).map(p=>({k:p.k,v:p.cv,note:p.jn+' joined'})),{color:P[0],drill:'pos'})),
    tile('CVs needed per hire, by position','The hardest roles to fill sit at the top',
      hbar(pg.filter(p=>p.cv>=5).map(p=>({k:p.k,v:p.jn?p.cv/p.jn:0,note:p.jn?p.jn+' hires':'0 hires'})).sort((a,b)=>b.v-a.v).slice(0,12),
        {color:P[3],fmt:v=>v?f1(v):'no hire',drill:'pos'})),
    tile('How long open requisitions have been running','Days since the requisition was raised',
      hbar(agB,{color:P[3],rh:26,lw:104,drill:'reqage'}),
      '',cnt(rq,q=>q.status==='OPEN'&&q.age==null)+' open requisitions have no opening date recorded and are not counted here.'),
    tile('Open seats by owner','Unfilled positions on each recruiter\'s plate',hbar(own,{color:P[4],rh:24,drill:'ownerreq'})),
    tile('Position detail','CV demand against actual outcomes — click a header to sort','<div>'+
      tbl('t_pos',[{t:'Position'},{t:'Code'},{t:'Dept'},{t:'CVs',n:1},{t:'Interviewed',n:1},{t:'Reached sel.',n:1},{t:'Joined',n:1},{t:'Open',n:1},{t:'CV→Join',n:1},{t:'CVs per hire',n:1},{t:'Median days CV→join',n:1}],
        pg.map(p=>[p.k,p.code||'–',p.dept,p.cv,p.iv,p.sl,nv(p.jn,'g'),nv(p.ac,'o'),
          nv(p.cv2j,p.cv2j>=15?'g':p.cv2j<5?'r':'',v=>f1(v)+'%'),
          nv(p.perHire,p.perHire>15?'r':'',v=>f1(v)),nv(p.tat)]))+'</div>'),
    tile('Fill rate by position','Days to place one person, and how long the remaining seats should take','<div>'+
      tbl('t_fr',[{t:'Position'},{t:'Dept'},{t:'Placed',n:1},{t:'Seats left',n:1},{t:'Req open (d)',n:1},
        {t:'Days / person',n:1},{t:'Projected to clear',n:1}],
        fillByPos(rq).sort((a,b)=>(b.proj||0)-(a.proj||0))
          .map(x=>[x.k,x.dept,x.onb,nv(x.bal,x.bal>0?'o':''),nv(x.el),
            nv(x.per,x.per>60?'r':x.per<15?'g':'',v=>f1(v)+' d'),
            nv(x.bal?x.proj:null,x.proj>180?'r':'',v=>f0(v)+' d')]))+'</div>'),
    tile('Overdue requisitions','Past their closing date and still open','<div>'+
      tbl('t_od',[{t:'Position'},{t:'Dept'},{t:'Location'},{t:'Need',n:1},{t:'On board',n:1},{t:'Open',n:1},{t:'Owner'},{t:'Days open',n:1},{t:'Due'}],
        od.map(q=>[q.pos,q.dept,q.loc,q.nos,q.onboard,nv(q.bal,'r'),q.owner,nv(q.age,'r'),q.end]))+'</div>'),
    tile('Department funnel','CVs, selections and joins per department',
      ghbar(dep,[{k:'cv',n:'CVs',c:P[0]},{k:'sl',n:'Reached selection',c:P[2]},{k:'jn',n:'Joined',c:P[1]}],{drill:'deptout'})),
  ].join('');
}

/* ---- page: salary ---- */
function pgSal(d,m){
  const hs=d.filter(r=>r.hike!=null);
  const cs=d.map(r=>r.cs).filter(Boolean), es=d.map(r=>r.es).filter(Boolean);
  const bands=[[-1e4,0,'Cut / same'],[0,10,'0–10%'],[10,20,'10–20%'],[20,30,'20–30%'],[30,50,'30–50%'],[50,1e6,'Over 50%']];
  const sb=[[0,15000,'< ₹15k'],[15000,25000,'₹15–25k'],[25000,35000,'₹25–35k'],[35000,50000,'₹35–50k'],[50000,1e9,'₹50k+']];
  const dG=[...grp(d,r=>r.dept)].map(([k,v])=>({k,cur:med(v.map(r=>r.cs))||0,exp:med(v.map(r=>r.es))||0}))
    .filter(x=>x.cur||x.exp).sort((a,b)=>b.exp-a.exp);
  const dp=[...grp(d.filter(r=>r.selected),r=>r.pos)].map(([k,v])=>({k,sl:v.length,jn:cnt(v,r=>r.joined)}))
    .map(x=>({...x,dr:pct(x.sl-x.jn,x.sl)})).filter(x=>x.sl>=2).sort((a,b)=>(b.sl-b.jn)-(a.sl-a.jn));
  const at=d.filter(r=>r.left);
  return [
    tile('Hike expected by candidates','(Expected − Current) ÷ Current, where both were recorded',
      hbar(bands.map(([lo,hi,lab])=>({k:lab,v:cnt(hs,r=>r.hike>lo&&r.hike<=hi)})),{color:P[4],rh:24,drill:'hike'})),
    tile('Join rate by hike band','Do big hike demands predict a drop-out?',
      hbar(bands.map(([lo,hi,lab])=>{const g=hs.filter(r=>r.hike>lo&&r.hike<=hi);
        return {k:lab,v:pct(cnt(g,r=>r.joined),g.length),note:cnt(g,r=>r.joined)+'/'+g.length};}),
        {color:P[1],fmt:v=>f1(v)+'%',rh:24,drill:'hike'}),
      '','Samples in each band are small, so read individual bars with care. The reliable signal is the tail: candidates asking for very large hikes rarely complete the process.'),
    tile('Median salary by department','Current vs expected, monthly ₹',
      ghbar(dG,[{k:'cur',n:'Current',c:P[0]},{k:'exp',n:'Expected',c:P[2]}],{drill:'deptout'})),
    tile('Current salary distribution','Monthly ₹, where recorded',
      hbar(sb.map(([lo,hi,lab])=>({k:lab,v:cnt(d,r=>r.cs!=null&&r.cs>=lo&&r.cs<hi)})),{color:P[5],rh:24,drill:'salband'}),
      '','Only the '+cnt(d,r=>r.cs!=null)+' candidates whose current salary was actually recorded are counted. '
        +'The remaining '+cnt(d,r=>r.cs==null)+' are blank or written as text such as "as per company norms" and are excluded rather than treated as zero.'),
    tile('Offer drop-off by position','Selected but never joined','<div>'+
      tbl('t_dp',[{t:'Position'},{t:'Selected',n:1},{t:'Joined',n:1},{t:'Dropped',n:1},{t:'Drop-off',n:1}],
        dp.map(x=>[x.k,x.sl,nv(x.jn,'g'),nv(x.sl-x.jn,'r'),nv(x.dr,x.dr>50?'r':'',v=>f1(v)+'%')]))+'</div>'),
    tile('Salary summary','Medians across the current selection',
      tbl('t_sal',[{t:'Measure'},{t:'Value',n:1},{t:'Based on',n:1}],[
        ['Median current salary',nv(med(cs),'',inr),cs.length+' records'],
        ['Median expected salary',nv(med(es),'',inr),es.length+' records'],
        ['Median hike expected',nv(hs.length?med(hs.map(r=>r.hike)):null,'',v=>f1(v)+'%'),hs.length+' records'],
        ['Median hike of joiners',nv(med(d.filter(r=>r.joined&&r.hike!=null).map(r=>r.hike)),'g',v=>f1(v)+'%'),cnt(d,r=>r.joined&&r.hike!=null)+' joiners'],
        ['Median current — joiners',nv(med(d.filter(r=>r.joined).map(r=>r.cs)),'',inr),cnt(d,r=>r.joined&&r.cs)+' joiners'],
        ['Median expected — joiners',nv(med(d.filter(r=>r.joined).map(r=>r.es)),'',inr),cnt(d,r=>r.joined&&r.es)+' joiners'],
      ])),
    tile('Early attrition','People who joined and have already left','<div>'+
      tbl('t_at',[{t:'Candidate'},{t:'Position'},{t:'Source'},{t:'Recruiter'},{t:'Joined'},{t:'Remark',w:1}],
        at.map(r=>[r.name,r.pos,r.src,r.rec,r.jd||'–',r.remark||'–']))+'</div>'),
    tile('Hike vs outcome','Median hike asked, by final outcome',
      hbar([{k:'Joined',v:med(d.filter(r=>r.joined&&r.hike!=null).map(r=>r.hike))||0},
            {k:'Selected, not joined',v:med(d.filter(r=>r.selected&&!r.joined&&r.hike!=null).map(r=>r.hike))||0},
            {k:'Still in pipeline',v:med(d.filter(r=>r.active&&!r.selected&&r.hike!=null).map(r=>r.hike))||0},
            {k:'Rejected / not interested',v:med(d.filter(r=>r.lost&&r.hike!=null).map(r=>r.hike))||0}],
        {fmt:v=>f1(v)+'%',color:P[6],rh:26,lw:136,drill:'outcome'})),
  ].join('');
}

/* ---- page: records ---- */
function pgRec(d){
  /* stacked full-width, requisitions first — these tables are far too wide to sit side by side */
  return tile('Requisition records',applyR().length+' requisitions','<div>'+
      tbl('t_rq',[{t:'Position'},{t:'Code'},{t:'Dept'},{t:'Location'},{t:'Status'},{t:'Need',n:1},{t:'On board',n:1},
        {t:'Open',n:1},{t:'Owner'},{t:'Days open',n:1},{t:'Due'},{t:'Remark',w:1}],
        applyR().map(q=>[q.pos,q.code||'–',q.dept,q.loc,
          {s:q.status,h:`<span class="pill" style="background:${q.status==='OPEN'?'rgba(245,165,36,.15);color:var(--a3)':q.status==='CLOSED'?'rgba(46,204,155,.15);color:var(--a2)':'rgba(147,161,179,.15);color:var(--tx2)'}">${esc(q.status)}</span>`},
          q.nos,q.onboard,nv(q.bal,q.bal>0?'o':''),q.owner,nv(q.age),q.end||'–',q.remark||'–']))+'</div>','t2 w4')
    + tile('Candidate records',d.length+' rows matching the current filters — click any header to sort','<div>'+
    tbl('t_all',[{t:'Candidate'},{t:'Position'},{t:'Code'},{t:'Dept'},{t:'Source'},{t:'Recruiter'},{t:'Interviewer'},
      {t:'Location'},{t:'Mode'},{t:'Status'},{t:'CV date'},{t:'Interview'},{t:'Selected'},{t:'Joined'},
      {t:'Days',n:1},{t:'Current ₹',n:1},{t:'Expected ₹',n:1},{t:'Hike',n:1},{t:'Remark',w:1}],
      d.map(r=>[r.name,r.pos,r.code||'–',r.dept,r.src,r.rec,r.panel,r.loc,r.mode,
        {s:r.status,h:statusPill(r.status)},r.cvd||'–',r.ivd||'–',r.seld||'–',r.jd||'–',
        nv(r.d_total),nv(r.cs,'',inr),nv(r.es,'',inr),nv(r.hike,r.hike>50?'r':'',v=>f1(v)+'%'),r.remark||'–']))
    +'</div>','t2 w4');
}

/* ---- insights ---- */
function insights(d,m,rq){
  const o=[];
  const src=[...grp(d,r=>r.src)].map(([k,v])=>({k,cv:v.length,jn:cnt(v,r=>r.joined)}))
    .filter(x=>x.cv>=15).map(x=>({...x,y:pct(x.jn,x.cv)})).sort((a,b)=>b.y-a.y);
  if(src.length>1){const b=src[0],w=src[src.length-1];
    o.push({c:'var(--a2)',t:'Sourcing channels are not equal',
      d:`<b>${esc(b.k)}</b> converts ${f1(b.y)}% of CVs into joiners (${b.jn} of ${b.cv}). <b>${esc(w.k)}</b> manages ${f1(w.y)}% (${w.jn} of ${w.cv}).`});}
  const z=src.filter(x=>!x.jn);
  if(z.length)o.push({c:'var(--a4)',t:'Channels producing nothing',
    d:`${z.map(x=>`<b>${esc(x.k)}</b> (${x.cv} CVs)`).join(', ')} produced zero hires — screening time with no result.`});
  if(m.sl)o.push({c:m.drop>40?'var(--a4)':'var(--a3)',t:'Offer drop-off is the costliest leak',
    d:`${m.sl} selected, ${m.jn} joined — <b>${f1(m.drop)}%</b> walked away after full sourcing and interview cost was paid.`});
  const st=d.filter(r=>r.status==='Shortlisted');
  if(st.length>m.cv*.2){
    const T=new Date(), ag=st.filter(r=>r.cvd).map(r=>Math.round((T-new Date(r.cvd))/864e5));
    const old=ag.filter(x=>x>60).length;
    o.push({c:'var(--a3)',t:'A decision backlog, not a sourcing problem',
      d:`<b>${st.length}</b> candidates are interviewed and waiting on a yes/no — ${f1(pct(st.length,m.cv))}% of everyone. `
       +`Median wait <b>${f0(med(ag))} days</b>${old?`, and <b>${old}</b> have been waiting over 60 days`:''}. `
       +`The interview-to-selection step takes under a day for those who get a decision, so this queue is waiting on someone to make the call, not on recruitment.`});
  }
  const rc=[...grp(d,r=>r.rec)].map(([k,v])=>({k,cv:v.length,jn:cnt(v,r=>r.joined),ac:cnt(v,r=>r.active)}))
    .filter(x=>x.cv>=20).sort((a,b)=>pct(b.jn,b.cv)-pct(a.jn,a.cv));
  if(rc.length>1){const b=rc[0],w=rc[rc.length-1];
    o.push({c:'var(--a1)',t:'Volume and results are not tracking together',
      d:`<b>${esc(w.k)}</b>: ${w.cv} CVs → ${w.jn} joins (${f1(pct(w.jn,w.cv))}%), ${w.ac} still open. <b>${esc(b.k)}</b>: ${b.cv} → ${b.jn} (${f1(pct(b.jn,b.cv))}%).`});}
  const pg=[...grp(d,r=>r.pos)].map(([k,v])=>({k,cv:v.length,jn:cnt(v,r=>r.joined)}))
    .filter(x=>x.cv>=15).sort((a,b)=>b.cv/(b.jn||.5)-a.cv/(a.jn||.5));
  if(pg.length){const p=pg[0];
    o.push({c:'var(--a5)',t:'Hardest role to fill',
      d:`<b>${esc(p.k)}</b> consumed ${p.cv} CVs for ${p.jn} hire${p.jn===1?'':'s'} — about <b>${p.jn?f1(p.cv/p.jn):'∞'} CVs per hire</b>.`});}
  if(m.lf)o.push({c:'var(--a4)',t:'Some hires are not sticking',
    d:`<b>${m.lf}</b> of ${m.jn} joiners have already left (${f1(m.attr)}%) — the hire cost was paid twice.`});
  const od=rq.filter(q=>q.overdue);
  if(od.length)o.push({c:'var(--a3)',t:'Requisitions past deadline',
    d:`<b>${od.length}</b> overdue, covering <b>${sum(od,q=>q.bal)}</b> unfilled seats. Oldest open ${Math.max(...od.map(q=>q.age||0))} days.`});
  const sq=stageStats(d,rq);
  if(sq.rn>=5&&sq.rtot.avg)o.push({c:'var(--a6)',t:'The delay is before sourcing starts, not during it',
    d:`Across ${sq.rn} traceable hires, <b>${f1(sq.r0.avg)} days</b> pass between the requisition being raised and the first CV arriving — <b>${f0(pct(sq.r0.avg,sq.rtot.avg))}%</b> of the entire ${f1(sq.rtot.avg)}-day timeline. Everything after the CV lands takes just ${f1(sq.rtot.avg-sq.r0.avg)} days combined. Speeding up interviews would barely move the number.`});
  else if(m.t3!=null)o.push({c:'var(--a6)',t:'Where the calendar time goes',
    d:`CV→interview <b>${m.t1??'–'}d</b>, interview→selection <b>${m.t2??'–'}d</b>, selection→joining <b>${m.t3}d</b>. The notice-period gap is exactly when counter-offers land.`});
  return o;
}

/* ---- export ---- */
function exportCSV(){
  const d=apply();
  const cols=['name','pos','code','dept','src','mode','rec','panel','loc','status','cvd','ivd','seld','jd',
    'd_cv_iv','d_iv_sel','d_sel_join','d_total','cs','es','hike','remark'];
  const hdr=['Candidate','Position','Job Code','Department','Source','Mode','Recruiter','Interviewer','Location',
    'Status','CV Date','Interview Date','Selected Date','Joining Date','Days CV-Interview','Days Interview-Selection',
    'Days Selection-Joining','Days Total','Current Salary','Expected Salary','Hike %','Remark'];
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const csv=[hdr.map(q).join(',')].concat(d.map(r=>cols.map(c=>q(r[c])).join(','))).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));
  a.download='hr_recruitment_filtered.csv'; a.click();
  toast('Exported '+f0(d.length)+' filtered rows to CSV.');
}
